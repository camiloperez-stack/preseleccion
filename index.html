<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Aptitud y Criterio - Auxiliar Administrativo</title>
    
    <!-- Fuentes Google: Plus Jakarta Sans + Space Grotesk (Estilo Vectorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --illustrator-black: #111111;
            --illustrator-purple: #6366f1;
            --illustrator-yellow: #ffde59;
            --illustrator-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #4b5563;
            --stroke-width: 2.5px;
            /* Sombra vectorial rígida estilo Illustrator/Figma */
            --vector-shadow: 4px 4px 0px #111111;
            --vector-shadow-hover: 6px 6px 0px #111111;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--illustrator-bg);
            /* Patrón de puntos tipo cuadrícula de diseño / Illustrator grid */
            background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .main-container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 45px;
            border-radius: var(--radius);
            border: var(--stroke-width) solid var(--illustrator-black);
            box-shadow: 8px 8px 0px var(--illustrator-black);
        }

        /* Banner de Encabezado */
        .header-banner {
            border-bottom: var(--stroke-width) solid var(--illustrator-black);
            padding-bottom: 25px;
            margin-bottom: 35px;
            position: relative;
        }

        .artboard-tag {
            display: inline-block;
            background: var(--illustrator-yellow);
            border: var(--stroke-width) solid var(--illustrator-black);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            box-shadow: 2px 2px 0px var(--illustrator-black);
        }

        .header-banner h1 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.03em;
        }

        .header-banner p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }

        /* Barra de Cronómetro Flotante */
        .timer-sticky {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            border: var(--stroke-width) solid var(--illustrator-black);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            box-shadow: var(--vector-shadow);
            margin-bottom: 35px;
            z-index: 100;
        }

        .timer-badge {
            background: #ff5252;
            color: #ffffff;
            border: var(--stroke-width) solid var(--illustrator-black);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            box-shadow: 2px 2px 0px var(--illustrator-black);
        }

        /* Caja de Alerta */
        .alert-box {
            background-color: #fef08a;
            border: var(--stroke-width) solid var(--illustrator-black);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 40px;
            font-size: 0.92rem;
            box-shadow: var(--vector-shadow);
        }

        .alert-box ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }
